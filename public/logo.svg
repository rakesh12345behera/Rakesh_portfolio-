<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="cubeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Base Plate -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="#070c18" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" />

  <!-- 3D Isometric Hex Cube Silhouette -->
  <g transform="translate(60, 60)" filter="url(#cubeGlow)">
    <!-- Top Face of Cube -->
    <polygon points="0,-42 36,-21 0,0 -36,-21" fill="url(#topFace)" opacity="0.9" />

    <!-- Left Face of Cube -->
    <polygon points="-36,-21 0,0 0,42 -36,21" fill="url(#leftFace)" stroke="#00f2fe" stroke-width="1.5" />

    <!-- Right Face of Cube -->
    <polygon points="0,0 36,-21 36,21 0,42" fill="url(#rightFace)" stroke="#818cf8" stroke-width="1.5" />

    <!-- Embedded Bold 'R' Ribbon on Left Face -->
    <path d="M -26,12 L -26,-10 L -12,-10 C -6,-10 -6,-1 -12,-1 L -26,-1 M -14,-1 L -8,12" 
          fill="none" stroke="url(#neonCyan)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Embedded Bold 'B' Ribbon on Right Face -->
    <path d="M 8,-12 L 8,12 M 8,-12 L 18,-12 C 24,-12 24,-2 18,-2 L 8,-2 L 20,-2 C 26,-2 26,12 18,12 L 8,12" 
          fill="none" stroke="url(#neonPurple)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Vertex Energy Core -->
    <circle cx="0" cy="0" r="4" fill="#00f2fe" />
  </g>
</svg>
