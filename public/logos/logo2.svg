<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="infGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e17" />
      <stop offset="100%" stop-color="#18132b" />
    </linearGradient>
    <filter id="neonGlow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Base Plate with Ambient Violet Border -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad2)" stroke="url(#infGrad)" stroke-width="2.5" />

  <!-- Code Bracket Accents -->
  <path d="M 22 45 L 12 60 L 22 75" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M 98 45 L 108 60 L 98 75" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <!-- Infinity / Monogram Loop -->
  <g filter="url(#neonGlow2)">
    <!-- Continuous Flow Infinity Shape forming R & B -->
    <path d="M 42 42 
             C 42 32, 54 32, 60 44 
             C 66 56, 78 56, 78 46 
             C 78 36, 68 36, 60 46 
             L 60 74 
             C 60 84, 76 84, 76 72 
             C 76 60, 60 60, 42 60 
             L 42 78" 
          fill="none" 
          stroke="url(#infGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Sharp Stylized R Kick -->
    <line x1="42" y1="36" x2="42" y2="84" stroke="url(#infGrad)" stroke-width="7" stroke-linecap="round" />
    <line x1="42" y1="60" x2="56" y2="84" stroke="#00f2fe" stroke-width="6.5" stroke-linecap="round" />

    <!-- Pulse Node in Center -->
    <circle cx="60" cy="60" r="4.5" fill="#ffffff" />
  </g>
</svg>
