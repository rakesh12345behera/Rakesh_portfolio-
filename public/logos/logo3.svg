<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Radiant Diamond Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#141a2e" />
    </linearGradient>
    <linearGradient id="electricBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Futuristic Hexagonal Shield -->
  <polygon points="60,8 108,30 108,82 60,112 12,82 12,30" 
           fill="url(#shieldBg)" 
           stroke="url(#electricBorder)" 
           stroke-width="3" 
           filter="url(#shieldGlow)" />

  <!-- Inner Subtle Accent Border -->
  <polygon points="60,16 100,34 100,78 60,102 20,78 20,34" 
           fill="none" 
           stroke="rgba(255, 255, 255, 0.08)" 
           stroke-width="1.5" />

  <!-- Top Accent Node -->
  <circle cx="60" cy="18" r="3" fill="#38bdf8" />

  <!-- Stylized Modern Typography: <RB /> -->
  <text x="60" y="67" 
        text-anchor="middle" 
        dominant-baseline="middle" 
        font-family="'JetBrains Mono', 'Fira Code', monospace" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="-1.5" 
        fill="url(#glyphGrad)" 
        filter="url(#shieldGlow)">
    &lt;RB/&gt;
  </text>

  <!-- Bottom Terminal Status Prompt Dot -->
  <circle cx="60" cy="92" r="3" fill="#34d399" />
</svg>
